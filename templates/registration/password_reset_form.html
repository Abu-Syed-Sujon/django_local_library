<!--Collect user email-->

{% extends "base_generic.html" %}

{% block content %}
  <h2>Reset Password</h2>

  <form method="post">
    {% csrf_token %}

    {% if form.email.errors %}
      <div class="error">{{ form.email.errors }}</div>
    {% endif %}

    <label>Email:</label>
    {{ form.email }}

    <br><br>
    <button type="submit">Send Reset Link</button>
  </form>
{% endblock %}
